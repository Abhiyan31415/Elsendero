# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the Gantabya API (Docker) plus a free Render Key Value (Redis)
# instance used by the socket.io adapter and shared rate limits.

services:
  - type: web
    name: gantabya-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGO_CONNECT
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: R2_ENDPOINT
        value: https://cef3bc5e60493c2cde2fa645dac8c39f.r2.cloudflarestorage.com
      - key: R2_BUCKET
        value: gantabya
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gantabya-redis
          property: connectionString

  - type: keyvalue
    name: gantabya-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: [] # only reachable from services on Render's private network
