[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://redly-phonological-mariam.ngrok-free.dev/api/:splat"
  status = 200
  force = true

# SPA fallback rule (keep this at the bottom of the file)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200