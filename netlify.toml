[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # VITE_API_URL and VITE_MAPBOX_TOKEN must be set in the Netlify UI
  # (Site configuration -> Environment variables). The frontend calls the
  # backend directly at VITE_API_URL, so no API proxy redirect is needed.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Vite emits content-hashed filenames under /assets, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback rule (keep this at the bottom of the file)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
